name: Tag versioned release
# Create a version tag from the package metadata on main.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - debian/changelog
      - .github/workflows/tag-versioned-release.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify package versions and create release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          changelog_version=$(sed -n '1s/^viewpie (\(.*\)) unstable;.*/\1/p' debian/changelog)
          expected_changelog="$cargo_version-1"
          if [ "$changelog_version" != "$expected_changelog" ]; then
            echo "Unexpected release versions: Cargo=$cargo_version changelog=$changelog_version" >&2
            exit 1
          fi
          tag="v$cargo_version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            current_tag_commit=$(git rev-list -n 1 "$tag")
            head_commit=$(git rev-parse HEAD)
            if [ "$current_tag_commit" = "$head_commit" ]; then
              echo "Tag already points to HEAD"
              exit 0
            fi
            echo "Existing tag points to an older commit; moving it to the verified release commit"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -fa "$tag" -m "Viewpie $tag"
            git push --force origin "refs/tags/$tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Viewpie $tag"
          git push origin "refs/tags/$tag"

# Allow the version-tag workflow to run after release-pipeline-only fixes.
