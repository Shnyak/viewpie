name: release

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows:
      - Tag versioned release
    types:
      - completed

# Declared per job rather than here: only the jobs that publish need more than
# to read the repository.
permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Resolve release version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install what the crate builds against
        run: |
          # Use the same reachable-mirror selection as the regular CI workflow.
          # The default Azure mirror and archive.ubuntu.com were unreachable in recent runs.
          MIRROR=""
          for candidate in \
            https://mirrors.edge.kernel.org/ubuntu \
            https://ubuntu.osuosl.org/ubuntu \
            https://mirror.math.princeton.edu/pub/ubuntu; do
            if curl -fsSI --connect-timeout 5 --max-time 12 \
              "$candidate/dists/noble/InRelease" >/dev/null; then
              MIRROR="$candidate"
              break
            fi
          done
          if [ -z "$MIRROR" ]; then
            echo "No reachable Ubuntu package mirror found" >&2
            exit 1
          fi
          echo "Using Ubuntu mirror: $MIRROR"
          echo "$MIRROR" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends \
            pkg-config libavcodec-dev libavformat-dev libavutil-dev \
            libclang-dev clang
      # Panel-manager tests share process-wide singleton state. Keep the
      # release gate consistent with ci.yml so parallel test execution cannot
      # make the result nondeterministic.
      - name: Run unit tests serially
        run: cargo test --locked -- --test-threads=1

  deb:
    needs: test
    runs-on: ubuntu-latest
    if: needs.test.result == 'success'
    strategy:
      matrix:
        arch: [armhf, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Resolve release version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the versions against the tag
        run: |
          tag="${{ steps.release.outputs.version }}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$tag" ]; then
            echo "Cargo.toml version $version does not match tag $tag" >&2
            exit 1
          fi
          changelog=$(sed -n '1s/^viewpie (\(.*\)-[^-]*).*/\1/p' debian/changelog)
          if [ "$changelog" != "$tag" ]; then
            echo "debian/changelog version $changelog does not match tag $tag" >&2
            exit 1
          fi
      - name: Record source build date
        run: echo "VIEWPIE_BUILD_DATE=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
      - name: Build the package
        run: ./scripts/build-deb.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  image:
    if: needs.deb.result == 'success'
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Resolve release version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          # Container registries require lowercase repository names. The GitHub
          # owner is mixed-case ("Shnyak"), so do not use github.repository here.
          images: ghcr.io/shnyak/viewpie
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ github.event_name == 'workflow_run' }}
          flavor: |
            latest=auto
      - name: Name the package each architecture installs
        id: debs
        run: |
          version="${{ steps.release.outputs.version }}"
          revision=$(sed -n "1s/^viewpie ($version-\([^)]*\)).*/\1/p" debian/changelog)
          echo "armhf=dist/viewpie_${version}-${revision}_armhf.deb" >> "$GITHUB_OUTPUT"
          echo "arm64=dist/viewpie_${version}-${revision}_arm64.deb" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v7
          build-args: DEB=${{ steps.debs.outputs.armhf }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/shnyak/viewpie,push-by-digest=true,name-canonical=true,push=true
        id: armhf
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: DEB=${{ steps.debs.outputs.arm64 }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/shnyak/viewpie,push-by-digest=true,name-canonical=true,push=true
        id: arm64
      - name: Join them under one tag
        run: |
          printf '%s\\n' '${{ steps.meta.outputs.tags }}' | while read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" \
              "ghcr.io/shnyak/viewpie@${{ steps.armhf.outputs.digest }}" \
              "ghcr.io/shnyak/viewpie@${{ steps.arm64.outputs.digest }}"
          done

  publish:
    needs: [deb, image]
    if: needs.deb.result == 'success' && needs.image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Resolve release version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.release.outputs.tag }}" dist/*.deb --generate-notes
