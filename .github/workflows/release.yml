name: release

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows:
      - Tag versioned release
    types:
      - completed

# Declared per job rather than here: only the jobs that publish need more than
# to read the repository.
permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Resolve release version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install what the crate builds against
        run: |
          # Use the same reachable-mirror selection as the regular CI workflow.
          # The default Azure mirror and archive.ubuntu.com were unreachable in recent runs.
          MIRROR=""
          for candidate in \
            https://mirrors.edge.kernel.org/ubuntu \
            https://ubuntu.osuosl.org/ubuntu \
            https://mirror.math.princeton.edu/pub/ubuntu; do
            if curl -fsSI --connect-timeout 5 --max-time 12 \
              "$candidate/dists/noble/InRelease" >/dev/null; then
              MIRROR="$candidate"
              break
            fi
          done
          if [ -z "$MIRROR" ]; then
            echo "No reachable Ubuntu package mirror found" >&2
            exit 1
          fi
          echo "Using Ubuntu mirror: $MIRROR"
          echo "$MIRROR" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends \
            pkg-config libavcodec-dev libavformat-dev libavutil-dev \
            libclang-dev clang
      # Panel-manager tests share process-wide singleton state. Keep the
      # release gate consistent with ci.yml so parallel test execution cannot
      # make the result nondeterministic.
      - name: Run unit tests serially
        run: cargo test --locked -- --test-threads=1
      - name: Run native-pipeline unit tests serially
        run: cargo test --locked --features native-pipeline --lib -- --test-threads=1

  deb:
    needs: test
    runs-on: ubuntu-latest
    if: needs.test.result == 'success'
    strategy:
      matrix:
        arch: [armhf, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Resolve release version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the versions against the tag
        run: |
          tag="${{ steps.release.outputs.version }}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$tag" ]; then
            echo "Cargo.toml version $version does not match tag $tag" >&2
            exit 1
          fi
          changelog=$(sed -n '1s/^viewpie (\(.*\)-[^-]*).*/\1/p' debian/changelog)
          if [ "$changelog" != "$tag" ]; then
            echo "debian/changelog version $changelog does not match tag $tag" >&2
            exit 1
          fi
      - name: Record source build date
        run: echo "VIEWPIE_BUILD_DATE=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
      - name: Cross-build the package without Docker
        run: ./scripts/build-deb.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  publish:
    needs: deb
    if: needs.deb.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Resolve release version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - name: Generate SHA256 manifest for bootstrap installs
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
      - name: Create or complete the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.deb dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/*.deb dist/SHA256SUMS --generate-notes || {
              echo "Release may have been created by the parallel tag workflow; uploading assets"
              gh release upload "$tag" dist/*.deb --clobber
            }
          fi
