[package]
name = "viewpie"
version = "0.2.0-fork"
edition = "2021"
description = "Fork of snoack/viewpie with HTTP REST API, panels and dynamic configuration (AI-generated modifications)"
license = "GPL-3.0-or-later"
repository = "https://github.com/snoack/viewpie"
default-run = "viewpie"

[[bin]]
name = "viewpie"
path = "src/main.rs"

# Headless test binary: same application logic, but without KMS/DRM and
# FFmpeg hardware decoding. Used by the integration tests in tests/.
[[bin]]
name = "viewpie-headless"
path = "src/bin/headless.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["full", "signal", "sync"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# Hardware backends (DRM/KMS, libcec) are enabled only for the ARM release
# build produced by Dockerfile.build — see scripts/build-deb.sh which passes
# `--features hw`. Desktop checkouts therefore build without C libraries.
# Note: `libcec-rs` is not published on crates.io; the CEC bridge in src/cec.rs
# talks to /dev/cec0 directly and needs no extra crate, so the `hw` feature
# only pulls in `drm`.
[features]
default = []
hw = ["dep:drm"]

[dependencies.drm]
# Примечание: в ТЗ была указана версия "1.5", однако в crates.io у крейта
# `drm` нет релизов 1.x/2.x — актуальная линейка 0.x (0.15.0). Оригинальный
# viewpie использует именно drm 0.15, API (drm::control, AtomicModeSet,
# framebuffer/plane/crtc handles) соответствует требованиям ТЗ.
version = "0.15"
optional = true

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
